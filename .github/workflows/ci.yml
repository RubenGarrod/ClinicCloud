name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  POSTGRES_USER: cliniccloud_test
  POSTGRES_PASSWORD: test_password_123
  POSTGRES_DB: cliniccloud_test
  JWT_SECRET: test_jwt_secret_for_ci_only_not_for_production
  REDIS_URL: redis://localhost:6379

jobs:
  # ===============================================
  # Backend Tests
  # ===============================================
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd api
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run database migrations
      run: |
        cd database/migrations
        for migration in $(ls *.sql | sort -V); do
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f "$migration"
        done
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

    - name: Run linting (flake8)
      run: |
        cd api
        pip install flake8
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests with coverage
      run: |
        cd api
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --ignore=tests/test_api.py || true
      env:
        POSTGRES_USER: ${{ env.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ env.POSTGRES_DB }}
        DB_HOST: localhost
        DB_PORT: 5432
        JWT_SECRET: ${{ env.JWT_SECRET }}
        REDIS_URL: ${{ env.REDIS_URL }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./api/coverage.xml
        flags: backend
        fail_ci_if_error: false

  # ===============================================
  # Frontend Tests
  # ===============================================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps

    - name: Run linting (ESLint)
      run: |
        cd frontend
        npm run lint --if-present || true

    - name: Run tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false --passWithNoTests
      env:
        CI: true

    - name: Build frontend
      run: |
        cd frontend
        npm run build
      env:
        REACT_APP_API_URL: http://localhost:8000
        REACT_APP_SEARCH_ENGINE_URL: http://localhost:8001
        CI: false
        GENERATE_SOURCEMAP: false

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/build/
        retention-days: 7

  # ===============================================
  # Security Scanning
  # ===============================================
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Python Security Check (Bandit)
      run: |
        pip install bandit
        cd api
        bandit -r app/ -f json -o bandit-report.json || true

    - name: NPM Audit
      run: |
        cd frontend
        npm audit --json > npm-audit.json || true

  # ===============================================
  # Docker Build Test
  # ===============================================
  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        file: ./api/Dockerfile
        push: false
        tags: cliniccloud-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: cliniccloud-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          REACT_APP_API_URL=http://localhost:8000
          REACT_APP_SEARCH_ENGINE_URL=http://localhost:8001

  # ===============================================
  # Integration Tests (Full Stack)
  # ===============================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        cat > .env << EOF
        ENVIRONMENT=production
        DEBUG=false
        LOG_LEVEL=INFO
        JWT_SECRET=test_jwt_secret_for_ci
        JWT_EXPIRE_HOURS=24
        POSTGRES_USER=cliniccloud
        POSTGRES_PASSWORD=test_password
        POSTGRES_DB=cliniccloud
        DB_HOST=db
        DB_PORT=5432
        DB_POOL_MIN_SIZE=2
        DB_POOL_MAX_SIZE=5
        REDIS_URL=redis://redis:6379
        RATE_LIMIT_ENABLED=true
        CORS_ORIGINS=http://localhost
        REACT_APP_API_URL=http://localhost:8000
        REACT_APP_SEARCH_ENGINE_URL=http://localhost:8001
        EOF

    - name: Start services with Docker Compose
      run: |
        docker compose up -d
        sleep 60  # Wait for services to be ready

    - name: Wait for API health
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:8000/api/health; then
            echo "API is healthy"
            break
          fi
          echo "Waiting for API... ($i/30)"
          sleep 5
        done

    - name: Run integration tests
      run: |
        bash scripts/test-integraciones.sh
      continue-on-error: true

    - name: Show service logs on failure
      if: failure()
      run: |
        docker compose logs api
        docker compose logs frontend
        docker compose logs db

    - name: Cleanup
      if: always()
      run: docker compose down -v

  # ===============================================
  # Notify on Success/Failure
  # ===============================================
  notify:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, docker-build, integration-tests]
    if: always()

    steps:
    - name: Check status
      run: |
        if [ "${{ needs.backend-tests.result }}" = "success" ] && \
           [ "${{ needs.frontend-tests.result }}" = "success" ] && \
           [ "${{ needs.docker-build.result }}" = "success" ]; then
          echo "✅ All checks passed!"
        else
          echo "❌ Some checks failed"
          exit 1
        fi
